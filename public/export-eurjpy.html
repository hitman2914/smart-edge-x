<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EURJPY CSV Export</title><style>body{margin:0;background:#0b1220;color:#e8eefb;font:16px system-ui;padding:22px}.card{max-width:560px;margin:8vh auto;background:#131f33;border:1px solid #30435f;border-radius:16px;padding:22px}button{width:100%;padding:16px;border:0;border-radius:10px;background:#2874d0;color:white;font-weight:700;font-size:16px}small{color:#aebbd0}#status{line-height:1.6;margin:16px 0}</style><div class="card"><h2>EUR/JPY M1 — Export saved candles</h2><div id="status">Checking this browser's saved historical data…</div><button id="download" disabled>Download EURJPY CSV</button><p><small>Reads the SMART EDGE X local candle database on this same website. Nothing is uploaded.</small></p></div><script>
const DB_NAME='smart-edge-x-cache',DB_VERSION=1;let candles=[];
function openDB(){return new Promise((resolve,reject)=>{const q=indexedDB.open(DB_NAME,DB_VERSION);q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
(async()=>{try{const db=await openDB();const data=await new Promise((resolve,reject)=>{const q=db.transaction('candles').objectStore('candles').get('EURJPY');q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)});db.close();if(!Array.isArray(data)||!data.length){document.getElementById('status').textContent='No EUR/JPY candles found in this browser storage. Open SMART EDGE X in this same browser first.';return}candles=data;document.getElementById('status').textContent=candles.length.toLocaleString()+' EUR/JPY candles found. Ready to export.';document.getElementById('download').disabled=false}catch(e){document.getElementById('status').textContent='Could not read local data: '+e.message}})();
document.getElementById('download').onclick=()=>{if(!candles.length)return;const rows=['timestamp,open,high,low,close'];for(const c of candles)rows.push([c.t,c.o,c.h,c.l,c.c].join(','));const blob=new Blob(['\\uFEFF'+rows.join('\\n')],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='EURJPY_M1_saved_candles.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);document.getElementById('status').textContent='Download started: '+candles.length.toLocaleString()+' candles.'};
</script></html>
